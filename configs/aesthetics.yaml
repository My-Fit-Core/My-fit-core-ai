# 추구미(기본 스타일) 및 카테고리 체계
# 상태: 기본 스타일 5개는 기획 확정(issue #44에서 Y2K → 스트리트), 프롬프트는 실험용 초안, 카테고리는 임시.
# key는 백엔드 DB와 동일하게 snake_case로 유지한다.
# prompts.outfit: 코디 사진용(1단계 실험), prompts.item: 옷 단독 사진용(2단계 실험, 추후 작성).
# kfashion: K-Fashion 스타일과의 잠정 연결. 근거는 docs/04-kfashion-validation.md 참고.

aesthetics:
  - key: feminine
    name: 페미닌
    prompts:
      outfit:
        - "a soft feminine outfit with a ribbon blouse and flowy skirt in pastel tones, feminine style"
        - "a ruffled pastel dress with a satin ribbon at the waist, feminine style"
        - "a pastel pink ruffled blouse with a ribbon tie, feminine style"
        - "a sweet outfit with ribbon bows and tiered ruffles in pastel colors, feminine style"
      item: []
    kfashion:
      styles: [로맨틱, 페미닌]
  - key: street
    name: 스트리트
    prompts:
      outfit:
        - "an oversized graphic hoodie with baggy cargo pants and a baseball cap, street style"
        - "an oversized sweatshirt with a big logo print, wide cargo pants and a snapback cap, street style"
        - "a loose graphic print hoodie with cargo pants and a backwards cap, street style"
        - "an oversized logo hoodie with baggy cargo pants and a cap, urban street style"
      item: []
    kfashion:
      styles: [힙합, 스포티]
      note: "K-Fashion 스트리트는 일상복에 가까워 우리 스트리트와 다르다(issue #44). 캐주얼에 연결"
  - key: minimal
    name: 미니멀
    prompts:
      outfit:
        - "a clean outfit with simple silhouettes in neutral tones, minimalist style"
        - "a plain white top with tailored black trousers, minimalist style"
        - "a monochrome outfit in beige with no patterns or logos, minimalist style"
        - "a sleek structured outfit in black and white with no decoration, minimalist style"
      item: []
    kfashion:
      styles: [모던, 소피스트케이티드]
      note: "근거 약함. 미니멀 쏠림의 영향을 받음"
  - key: vintage_layered
    name: 빈티지 레이어드
    prompts:
      outfit:
        - "a layered outfit of a vintage knit over a shirt with a long skirt in earthy tones, vintage layered style"
        - "multiple layers of worn, faded clothing in brown and olive tones, vintage layered style"
        - "a distressed wool vest layered over a long shirt and loose trousers in earth tones, vintage layered style"
        - "an aged corduroy jacket layered over several tops with a long skirt in muted earthy colors, vintage layered style"
      item: []
    kfashion:
      styles: [컨트리, 히피, 웨스턴]
      excluded: [밀리터리]
      note: "밀리터리는 색감 반응 가능성이 있어 제외"
  - key: casual
    name: 캐주얼
    prompts:
      outfit:
        - "a plain white t-shirt with basic straight jeans and simple sneakers in a regular fit, casual style"
        - "a solid gray knit sweater with regular-fit chinos, simple everyday casual style"
        - "a plain navy t-shirt with basic straight jeans in a regular fit, casual style"
        - "a solid-color button-up shirt with regular-fit chinos and simple sneakers, casual style"
      item: []
    kfashion:
      styles: [스트리트, 톰보이]
      note: "K-Fashion 스트리트는 일상복에 가까워 기본템인 캐주얼에 연결한다(issue #44)"

# 추구미 점수 보정 (issue #42에서 채택). 점수를 prior로 나눠 다시 합 1로 만든다.
# prior는 prompts.outfit 점수의 K-Fashion 표본 평균(시드 42, 23종 × 50장, issue #44에서 재계산). 프롬프트를 바꾸면 다시 측정한다.
calibration:
  prompt_set: outfit
  prior:
    feminine: 0.107
    street: 0.095
    minimal: 0.492
    vintage_layered: 0.231
    casual: 0.075

# 반대 개념 축 (issue #42 실험). 서비스 후보는 casual_formal, muted_colorful뿐이다. 값은 high 쪽일 확률(0~1).
# prompts는 같은 축을 다른 문장으로 적은 [low, high] 쌍이다. 쌍끼리 결과가 비슷해야 안정적이다.
axes:
  - key: casual_formal
    low: 캐주얼
    high: 포멀
    prompts:
      - ["a casual everyday outfit", "a formal dressed-up outfit"]
      - ["relaxed comfortable clothes for a weekend", "polished clothes for an office or a ceremony"]
  - key: muted_colorful
    low: 뮤트
    high: 컬러풀
    prompts:
      - ["an outfit in muted neutral colors", "an outfit in bright vivid colors"]
      - ["a toned-down outfit in black, white, gray or beige", "a colorful outfit with bold saturated colors"]
  - key: subtle_statement
    low: 은은한
    high: 스테이트먼트
    prompts:
      - ["a subtle understated outfit", "a bold statement outfit that stands out"]
      - ["simple quiet clothes with no eye-catching details", "eye-catching clothes with dramatic details"]

categories:  # TBD: 백엔드 ERD enum과 맞출 것
  top: [tshirt, shirt, blouse, knit, hoodie, sleeveless]
  bottom: [jeans, slacks, shorts, mini_skirt, long_skirt]
  dress: [mini_dress, long_dress]
  outer: [jacket, blazer, coat, cardigan, padding]
  shoes: [sneakers, flats, loafers, heels, boots, sandals]
  accessory: [bag, hat, scarf, jewelry]
