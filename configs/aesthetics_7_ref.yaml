# [실험, 서비스에 쓰지 않음] 레퍼런스 사진 + K-Fashion으로 고른 추구미 7종 코디 문장 (#111, 11/27)
# scripts/tune_reference_prompts.py --metric auc, 시작 aesthetics_7.yaml. 확인용에서 레퍼런스·K-Fashion 모두 개선. Report 261127-0000-01-reference-style-eval.md

aesthetics:
- key: minimal
  style_id: 1
  name: 미니멀
  prompts:
    outfit:
    - a plain white top with tailored black trousers, minimalist style
    - a sleek structured outfit in black and white with no decoration, minimalist style
    - a monochrome all-black outfit with sleek modern lines, minimalist style
    - a sleek monochrome outfit in black and white with a sharp modern silhouette, minimalist style
    item:
    - tailored black wide-leg trousers with a clean crease, minimalist style
    - a structured single-color blazer with clean lines, minimalist style
    - a sleek monochrome long coat in beige, minimalist style
    - a simple sleeveless slip dress in black, minimalist style
  kfashion:
    styles:
    - 모던
    note: 소피스트케이티드는 오피스/클래식으로 옮김(7종 실험)
- key: casual
  style_id: 2
  name: 캐주얼
  prompts:
    outfit:
    - a solid-color button-up shirt with regular-fit chinos and simple sneakers, casual style
    - a basic gray sweatshirt with blue jeans and white sneakers, everyday casual style
    - a plain hooded zip-up with straight jeans, simple daily casual style
    - a denim jacket with a denim skirt, denim casual look
    item:
    - a plain white t-shirt in a regular fit, casual style
    - a solid gray knit sweater, simple everyday casual style
    - basic straight-leg blue jeans, casual style
    - a solid-color button-up shirt in a regular fit, casual style
