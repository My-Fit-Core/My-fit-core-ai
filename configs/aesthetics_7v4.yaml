# 추구미 7종 실험 설정 — 손으로 고친 4차 문장 (issue #111). tune_style_prompts.py의 시작점. 서비스에 쓰지 않는다.
# 미니멀을 좁히고(모노톤·날렵한 선), 캐주얼·Y2K/빈티지·오피스/클래식·보헤미안 문장을 바꿨다. 연결 스타일은 aesthetics_7.yaml과 같다.

aesthetics:
