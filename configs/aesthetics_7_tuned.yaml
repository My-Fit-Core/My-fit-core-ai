axes:
- key: casual_formal
  low: 캐주얼
  high: 포멀
  prompts:
  - - a casual everyday outfit
    - a formal dressed-up outfit
  - - relaxed comfortable clothes for a weekend
    - polished clothes for an office or a ceremony
- key: muted_colorful
  low: 뮤트
  high: 컬러풀
  prompts:
  - - an outfit in muted neutral colors
    - an outfit in bright vivid colors
  - - a toned-down outfit in black, white, gray or beige
    - a colorful outfit with bold saturated colors
- key: subtle_statement
  low: 은은한
  high: 스테이트먼트
  prompts:
  - - a subtle understated outfit
    - a bold statement outfit that stands out
  - - simple quiet clothes with no eye-catching details
    - eye-catching clothes with dramatic details
