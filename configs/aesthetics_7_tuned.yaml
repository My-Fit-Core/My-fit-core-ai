# 추구미 7종 실험 설정 — 문장 후보(configs/style_prompt_pool.json)에서 자동으로 고른 문장 (issue #111). 서비스에 쓰지 않는다.
# 시작점 aesthetics_7v4.yaml, 다듬기용 사진 시드 42, 스타일마다 4문장. 연결 스타일은 aesthetics_7.yaml과 같다.

aesthetics:
- key: minimal
  style_id: 1
  name: 미니멀
  prompts:
    outfit:
    - a monochrome all-black outfit with sleek modern lines, minimalist style
    - a crisp white shirt with wide black trousers in a sharp monotone look, minimalist style
    - an all-gray tonal outfit with a long sleek coat, modern minimalist style
    - a clean girl outfit in white and cream with a sleek bun, minimal style
    item:
    - tailored black wide-leg trousers with a clean crease, minimalist style
    - a structured single-color blazer with clean lines, minimalist style
    - a sleek monochrome long coat in beige, minimalist style
    - a simple sleeveless slip dress in black, minimalist style
  kfashion:
    styles:
    - 모던
    note: 소피스트케이티드는 오피스/클래식으로 옮김(7종 실험)
- key: casual
  style_id: 2
  name: 캐주얼
  prompts:
    outfit:
    - a basic gray sweatshirt with blue jeans and white sneakers, everyday casual style
    - a cardigan over a t-shirt with cotton pants, comfy casual style
    - a denim jacket over a t-shirt with jeans, everyday campus casual style
    - a loose knit sweater with wide jeans and sneakers, comfy casual style
    item:
    - a plain white t-shirt in a regular fit, casual style
    - a solid gray knit sweater, simple everyday casual style
    - basic straight-leg blue jeans, casual style
    - a solid-color button-up shirt in a regular fit, casual style
  kfashion:
    styles:
    - 스트리트
    - 톰보이
    note: 'K-Fashion 스트리트는 일상복에 가까워 기본템인 캐주얼에 연결한다(issue #44)'
- key: feminine
