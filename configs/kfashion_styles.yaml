# K-Fashion 일반 스타일 23종 (평가용). name은 데이터셋 라벨 값과 같아야 한다.
# prompts.name_only: 같은 문장 틀에 스타일 이름만 넣은 프롬프트.
# prompts.described: 스타일 특징을 넣은 프롬프트 초안. 데이터셋의 공식 정의가 아니라 작성자가 쓴 표현이다.

styles:
