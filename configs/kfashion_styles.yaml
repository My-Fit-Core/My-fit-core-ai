    name: 스트리트
    prompts:
      name_only:
        - "a photo of a person wearing a street style outfit"
      described:
        - "an urban outfit with an oversized graphic tee, baggy pants and sneakers, street style"
        - "a hoodie layered under a bomber jacket with cargo pants and a cap, street style"
        - "a bold logo sweatshirt with wide jeans and chunky sneakers, street style"
